<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 | Page Not Found</title>
    <meta name="theme-color" content="#0b111b">
    <link rel="stylesheet" href="style.css">
  </head>
  <body class="page-404">
    <main class="card" id="page">
      <div class="badge">Navigation subsystem: confused</div>
      <div class="robot" aria-hidden="true">
        <div class="antenna"></div>
        <div class="head">
          <span class="eye left"></span>
          <span class="eye right"></span>
          <span class="mouth"></span>
        </div>
        <div class="body"></div>
      </div>
      <h1>404</h1>
      <h2>We searched everywhere.</h2>
      <p>
        Even behind the couch. This page has apparently escaped, changed its
        name, or never existed in the first place.
      </p>
      <div class="actions">
        <a href="/">Return to base</a>
        <button id="panic" type="button">Make it worse</button>
      </div>
    </main>
    <footer class="footer">
      <span>&#169; <span id="year">2026</span> &#183; Trezdin Kade Millon Martinez</span>
      <a href="/">Return to portfolio</a>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
