<!doctype html>
<html lang="en">
  <head>

    <title>404 | Page Not Found</title>

      content="Page not found on Trezdin's engineering portfolio."

          <span class="mouth"></span>
        </div>

      </div>
      <h1>404</h1>

        The requested page may have moved or is no longer available.
      </p>
      <div class="actions">
        <a href="/">Return to portfolio</a>
        <button id="panic" type="button">Preview redirect</button>
      </div>
    </main>
    <footer class="footer">
      <span>
        &#169; <span id="year">2026</span> &#183;
        Trezdin Kade Millon Martinez
      </span>
      <a href="/">BACK TO PORTFOLIO &#8593;</a>
