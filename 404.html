<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 | Page Not Found</title>
    <meta name="theme-color" content="#0b111b">
    <style>
      :root {
        color-scheme: dark;
        --ink: #0b111b;
        --panel: #121a27;
        --line: #263247;
        --paper: #f3f0e8;
        --orange: #ff6b35;
        --green: #b8f34a;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          var(--ink);
        background-size: 32px 32px;
        color: var(--paper);
        font-family: Arial, Helvetica, sans-serif;
      }

      .card {
        position: relative;
        width: min(680px, calc(100vw - 40px));
        text-align: center;
      }

      .badge {
        display: inline-block;
        margin-bottom: 14px;
        padding: 7px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--green);
        font: 700 12px/1 monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .robot {
        position: relative;
        width: 180px;
        height: 126px;
        margin: 0 auto 18px;
      }

      .head {
        position: absolute;
        left: 38px;
        top: 16px;
        width: 104px;
        height: 76px;
        border: 4px solid var(--paper);
        border-radius: 16px;
        background: var(--panel);
        transform-origin: center;
        animation: search 2.4s ease-in-out infinite;
      }

      .antenna {
        position: absolute;
        left: 86px;
        top: 0;
        width: 4px;
        height: 20px;
        border-radius: 4px;
        background: var(--paper);
      }

      .antenna::before {
        content: "";
        position: absolute;
        left: -5px;
        top: -7px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--orange);
        box-shadow: 0 0 18px rgba(255, 107, 53, 0.75);
      }

      .eye {
        position: absolute;
        top: 25px;
        width: 15px;
        height: 15px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 12px rgba(184, 243, 74, 0.8);
      }

      .eye.left { left: 22px; }
      .eye.right { right: 22px; }

      .mouth {
        position: absolute;
        left: 34px;
        bottom: 12px;
        width: 28px;
        height: 4px;
        border-radius: 4px;
        background: var(--paper);
      }

      .body {
        position: absolute;
        left: 55px;
        bottom: 0;
        width: 70px;
        height: 38px;
        border: 4px solid var(--paper);
        border-bottom: 0;
        border-radius: 12px 12px 0 0;
        background: var(--orange);
      }

      h1 {
        margin: 0;
        font-size: clamp(92px, 22vw, 180px);
        line-height: 0.72;
        letter-spacing: -0.09em;
        color: transparent;
        -webkit-text-stroke: 3px var(--paper);
        text-shadow: 10px 10px 0 var(--orange);
      }

      h2 {
        margin: 28px 0 10px;
        font-size: clamp(24px, 5vw, 42px);
        letter-spacing: -0.04em;
      }

      p {
        max-width: 520px;
        margin: 0 auto 24px;
        color: #bbc3cf;
        font-size: 16px;
        line-height: 1.6;
      }

      .actions {
        display: flex;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      a, button {
        appearance: none;
        border: 0;
        border-radius: 6px;
        padding: 13px 16px;
        background: var(--green);
        color: var(--ink);
        font: 800 13px/1 Arial, Helvetica, sans-serif;
        letter-spacing: 0.06em;
        text-decoration: none;
        text-transform: uppercase;
        cursor: pointer;
        transition: transform 150ms ease, box-shadow 150ms ease;
      }

      button {
        background: transparent;
        color: var(--paper);
        box-shadow: inset 0 0 0 1px var(--line);
      }

      a:hover, button:hover {
        transform: translateY(-3px);
        box-shadow: 5px 5px 0 var(--orange);
      }

      .lost {
        animation: fall 700ms cubic-bezier(.2,.8,.4,1);
      }

      @keyframes search {
        0%, 100% { transform: rotate(-5deg) translateX(-4px); }
        50% { transform: rotate(5deg) translateX(4px); }
      }

      @keyframes fall {
        0% { transform: rotate(0) translateY(0); }
        30% { transform: rotate(-8deg) translateY(-12px); }
        100% { transform: rotate(12deg) translateY(100vh); }
      }

      @media (prefers-reduced-motion: reduce) {
        .head { animation: none; }
        .lost { animation: none; }
        a, button { transition: none; }
      }
    </style>
  </head>
  <body>
    <main class="card" id="page">
      <div class="badge">Navigation subsystem: confused</div>
      <div class="robot" aria-hidden="true">
        <div class="antenna"></div>
        <div class="head">
          <span class="eye left"></span>
          <span class="eye right"></span>
          <span class="mouth"></span>
        </div>
        <div class="body"></div>
      </div>
      <h1>404</h1>
      <h2>We searched everywhere.</h2>
      <p>
        Even behind the couch. This page has apparently escaped, changed its
        name, or never existed in the first place.
      </p>
      <div class="actions">
        <a href="/">Return to base</a>
        <button id="panic" type="button">Make it worse</button>
      </div>
    </main>

    <script>
      document.getElementById("panic").addEventListener("click", function () {
        const page = document.getElementById("page");
        page.classList.remove("lost");
        void page.offsetWidth;
        page.classList.add("lost");

        window.setTimeout(function () {
          window.location.assign("/");
        }, 700);
      });
    </script>
  </body>
</html>
